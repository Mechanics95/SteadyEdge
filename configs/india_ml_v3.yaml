# v3 = v2 with the active sleeve replaced by a gradient-boosted ranking model
# (steadyedge/ml.py). v2 note: the stable sleeve leaves the index when it is below its
# 200-day average (well-known rule, not tuned here) and holds gold ETF instead.
# India: stable sleeve = Nifty 50 ETF held; active sleeve = momentum across
# large caps. KNOWN BIAS: the stock list is today's Nifty 50 leaders, so
# history is survivorship-biased upward. Treat active results as optimistic.
name: india_ml_v3
title: "India v3: trend-filtered index + ML ranking"
market: india
family: india   # trial count shared by every India experiment
capital: 44000            # INR, about $500 at an ASSUMED Rs 88/USD; update to the real rate
fractional: false         # Indian brokers trade whole shares only
max_loss: 22000           # kill switch: about $250, half of Max's total $500 loss limit
start: "2008-01-01"
download_start: "2005-01-01"
holdout_start: "2025-01-01"
benchmark: NIFTYBEES.NS
universe: [NIFTYBEES.NS, GOLDBEES.NS, RELIANCE.NS, TCS.NS, HDFCBANK.NS, INFY.NS, ICICIBANK.NS,
           HINDUNILVR.NS, ITC.NS, SBIN.NS, BHARTIARTL.NS, KOTAKBANK.NS, LT.NS, AXISBANK.NS,
           ASIANPAINT.NS, MARUTI.NS, SUNPHARMA.NS, TITAN.NS, BAJFINANCE.NS, HCLTECH.NS, WIPRO.NS]
stable: {strategy: trend_filter, params: {asset: NIFTYBEES.NS, window: 200, off_asset: GOLDBEES.NS, freq: W}}
active:
  strategy: ml_rank
  params: {horizon: 21, embargo: 5, train_years: 5, freq: M, universe: [GOLDBEES.NS, RELIANCE.NS, TCS.NS, HDFCBANK.NS, INFY.NS, ICICIBANK.NS,
           HINDUNILVR.NS, ITC.NS, SBIN.NS, BHARTIARTL.NS, KOTAKBANK.NS, LT.NS, AXISBANK.NS,
           ASIANPAINT.NS, MARUTI.NS, SUNPHARMA.NS, TITAN.NS, BAJFINANCE.NS, HCLTECH.NS, WIPRO.NS]}
  grid: {top_n: [2, 3]}
train_years: 5
test_years: 1
allocations:
  - {rule: fixed, stable_share: 0.9}
  - {rule: fixed, stable_share: 0.8}
  - {rule: fixed, stable_share: 0.7}
  - {rule: fixed, stable_share: 0.6}
  - {rule: fixed, stable_share: 0.5}
  - {rule: vol_target, stable_share: 0.8, target_vol: 0.15, max_active: 0.4}
  - {rule: drawdown_throttle, stable_share: 0.7, dd_limit: -0.15}
