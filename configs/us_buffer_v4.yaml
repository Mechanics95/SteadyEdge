# v4 = v2 with ONE theme, cutting trading costs: (a) momentum keeps a holding until
# it falls out of the top_n + 2 ranks, (b) a no-trade band skips resizing trades
# under 3% of equity. Same grid as v2 for a fair comparison.
# v2 changes ONE thing vs v1: the stable sleeve leaves the index when it is below its
# 200-day average (well-known rule, not tuned here) and holds IEF bonds instead.
# US: stable sleeve = S&P 500 ETF held; active sleeve = momentum across
# sector / asset-class ETFs (ETFs avoid single-stock survivorship bias).
name: us_buffer_v4
title: "US v4: trend-filtered index + low-turnover momentum"
market: us
family: us   # trial count for Deflated Sharpe is shared by every US experiment
capital: 500              # USD, Robinhood-style account
min_trade_frac: 0.03     # no-trade band: skip resizing trades under 3% of equity (exits always allowed)
fractional: true          # Robinhood supports fractional shares
max_loss: 250             # kill switch: half of Max's total $500 loss limit
start: "2007-01-01"
download_start: "2005-01-01"
holdout_start: "2025-01-01"   # sealed until a final candidate exists
benchmark: SPY
universe: [SPY, QQQ, IWM, EFA, EEM, TLT, IEF, GLD,
           XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLU, XLB]
stable: {strategy: trend_filter, params: {asset: SPY, window: 200, off_asset: IEF, freq: W}}
active:
  strategy: momentum_buffered
  params: {buffer: 2, skip: 21, freq: M, universe: [QQQ, IWM, EFA, EEM, TLT, IEF, GLD, XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLU, XLB]}
  grid: {lookback: [126, 252], top_n: [2, 3, 4]}
train_years: 5
test_years: 1
allocations:
  - {rule: fixed, stable_share: 0.9}
  - {rule: fixed, stable_share: 0.8}
  - {rule: fixed, stable_share: 0.7}
  - {rule: fixed, stable_share: 0.6}
  - {rule: fixed, stable_share: 0.5}
  - {rule: vol_target, stable_share: 0.8, target_vol: 0.15, max_active: 0.4}
  - {rule: drawdown_throttle, stable_share: 0.7, dd_limit: -0.15}
