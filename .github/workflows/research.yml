name: research-run
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 6"   # Saturdays 01:30 UTC
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: research, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[data,ml,dev]"
      - run: pytest -q
      - name: Download data and run every experiment
        run: |
          for cfg in configs/*.yaml; do
            case "$cfg" in *synthetic*) continue;; esac
            echo "::group::$cfg"
            python -m steadyedge download --config "$cfg"
            python -m steadyedge run --config "$cfg"
            echo "::endgroup::"
          done
      - run: python scripts/build_site.py
      - name: Commit results (keeps the trial log and proofs in the repo)
        run: |
          git config user.name "steadyedge-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Research run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase && git push
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: run
    runs-on: ubuntu-latest
    continue-on-error: true   # needs Settings > Pages > Source = GitHub Actions
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
